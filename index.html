<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <meta name="description" content="A simple to-do list application built with HTML, CSS, and JavaScript." />
  </head>
  <body class="bg-(--bg-primary)">
    <main class="md:max-w-300 max-w-md mx-auto">
      <div>
        <!-- title and informations -->
        <div class="flex items-center justify-center gap-2 p-2">
          <p class="text-2xl">🗓️</p>
          <h1 class="text-2xl font-bold text-(--text)">To-Do List</h1>
        </div>

        <!-- create a new task -->
         <div class="max-w-120 mx-auto mt-4 p-2">
           <form id="taskForm" class="flex items-center justify-between border border-gray-300 rounded-md overflow-hidden">
             <input type="text" id="taskInput" placeholder="Enter a new task"
               class="w-full rounded-sm text-md px-2 py-1.5 focus:outline-none text-(--text)" />
             <button type="submit" id="addTask" class="cursor-pointer px-2 py-2 bg-gray-100 border-l border-gray-300 text-sm text-(--text) hover:bg-gray-300 transition-all duration-300 ease-in-out">
               Add
             </button>
            </form>
         </div>

        <!-- list task -->
        <div class="flex flex-col gap-1 items-center max-w-120 mx-auto p-2 mt-4" id="taskList">
          <!-- task exanple -->
        </div>
      </div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
