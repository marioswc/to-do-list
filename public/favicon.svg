<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Degradado vertical estilo gris/monocromático -->
    <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6" />
      <stop offset="50%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
  </defs>
  <!-- Contenedor con bordes redondeados y un borde exterior definido -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#metallicGrad)" stroke="#1f2937" stroke-width="1.5" />
  <!-- Checkmark con diseño nítido y de alto contraste -->
  <path d="M9 16l5 5 9-9" stroke="#111827" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>